name: Selenium Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          cd tests
          pip install -r requierements.txt

      - name: Fix webdriver-manager (THIRD_PARTY_NOTICES)
        run: |
          set -e
          python - << 'PY'
          import os, glob, shutil

          base = os.path.expanduser("~/.wdm/drivers/chromedriver")
          notices = glob.glob(base + "/**/THIRD_PARTY_NOTICES.chromedriver", recursive=True)
          if not notices:
              raise SystemExit("THIRD_PARTY_NOTICES.chromedriver introuvable (webdriver-manager n'a peut-être pas téléchargé)")
          notice = sorted(notices)[-1]
          d = os.path.dirname(notice)
          candidates = glob.glob(d + "/**/chromedriver", recursive=True) + glob.glob(d + "/**/chromedriver.exe", recursive=True)
          if not candidates:
              raise SystemExit(f"chromedriver introuvable dans {d}")
          driver = candidates[0]
          shutil.copyfile(driver, notice)
          os.chmod(notice, 0o755)
          print("OK: remplacé", notice, "par", driver)
          PY

      - name: Lancer les tests Selenium
        run: |
          cd tests
          pytest test_selenium.py -v --html=report.html --self-contained-html
