name: Selenium Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          cd tests
          pip install -r requierements.txt

      # 🔽 Forcer le téléchargement de chromedriver
      - name: Télécharger ChromeDriver
        run: |
          python - << 'PY'
          from webdriver_manager.chrome import ChromeDriverManager
          ChromeDriverManager().install()
          print("ChromeDriver téléchargé")
          PY

      # 🔽 Fix du bug THIRD_PARTY_NOTICES
      - name: Fix webdriver-manager
        run: |
          python - << 'PY'
          import os, glob, shutil

          base = os.path.expanduser("~/.wdm/drivers/chromedriver")
          notices = glob.glob(base + "/**/THIRD_PARTY_NOTICES.chromedriver", recursive=True)

          if notices:
              notice = sorted(notices)[-1]
              d = os.path.dirname(notice)
              drivers = glob.glob(d + "/**/chromedriver", recursive=True)
              if drivers:
                  shutil.copyfile(drivers[0], notice)
                  os.chmod(notice, 0o755)
                  print("Fix appliqué")
          PY

      - name: Lancer les tests Selenium
        run: |
          cd tests
          pytest test_selenium.py -v --html=report.html --self-conta_
